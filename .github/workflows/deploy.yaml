name: Build, Push and Deploy

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write
  id-token: write


env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1 # TODO: Update with your AWS region if different

      - name: Deploy to EC2 via AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=cd-node-project" \
            --parameters 'commands=["set -e", "echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin", "cd /home/ubuntu/app", "docker compose pull", "docker compose up -d", "docker image prune -f"]' \
            --comment "Deploy latest Docker container" \
            --timeout-seconds 60 \
            --max-concurrency "50" \
            --max-errors "0" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId: $COMMAND_ID"

          # send-command only confirms the API call was accepted, not that any
          # instance actually ran it (e.g. an unregistered SSM Agent silently
          # matches zero targets and still reports "Success"). Poll until the
          # command reaches a terminal state, then fail loudly unless it
          # actually ran and completed on at least one instance.
          for i in $(seq 1 12); do
            STATUS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].Status" --output text)
            if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" ]]; then
              break
            fi
            sleep 5
          done

          aws ssm list-commands --command-id "$COMMAND_ID" --output json

          TARGET_COUNT=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].TargetCount" --output text)
          STATUS_DETAILS=$(aws ssm list-commands --command-id "$COMMAND_ID" --query "Commands[0].StatusDetails" --output text)

          if [[ "$TARGET_COUNT" == "0" ]]; then
            echo "::error::No EC2 instance picked up the deploy command (StatusDetails: $STATUS_DETAILS). The SSM Agent on the target instance is likely not registered with Systems Manager - check 'aws ssm describe-instance-information'."
            exit 1
          fi

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::Deploy command finished with status '$STATUS' (StatusDetails: $STATUS_DETAILS)."
            exit 1
          fi

